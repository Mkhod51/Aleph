version: 2
updates:
  # npm dependencies — keep the runtime + toolchain current.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # Bundle non-breaking dev-tool bumps so they land as one reviewable PR.
      dev-tools:
        dependency-type: development
        update-types:
          - minor
          - patch

  # GitHub Actions used by the workflow.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
